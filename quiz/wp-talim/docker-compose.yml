services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-talim_root_pw}
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-talim}
      MYSQL_PASSWORD: ${DB_PASSWORD:-talim_pw}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DB_USER:-talim}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-talim_pw}
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('H5PGEN_SERVICE_URL', 'http://h5p-service:8000');
    volumes:
      - ./wordpress/wp-content:/var/www/html/wp-content

  h5p-service:
    build: ./h5p-service
    restart: unless-stopped
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./generated:/app/generated

volumes:
  db_data:
